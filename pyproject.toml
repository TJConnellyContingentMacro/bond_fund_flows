[project]
name = "bondflows"
version = "0.1.0"
description = "Daily US bond ETF flow model"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "pandas>=2.2",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "playwright>=1.45",
    "python-dateutil>=2.9",
    "xlrd>=2.0.1",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
